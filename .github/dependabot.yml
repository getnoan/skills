version: 2
updates:
  # Keeps the SHA-pinned actions current: one grouped PR a month, which any maintainer
  # can approve (Dependabot is the author). Security fixes arrive at once regardless:
  # Dependabot security updates do not wait for this schedule.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
