name: conformance

# The skill is documentation that makes checkable claims about a live API.
# This job is what stops those claims rotting quietly between releases.
#
# The key is withheld from pull_request runs. This repository is public, a PR
# edits the very script that would run with the key, and GitHub does expose
# secrets to same-repo branch PRs — only forks are covered by the usual warning.
# So PRs check the spec, and push/schedule check the API.
#
# Note the expression below is `!= 'pull_request' && secret || ''`, not
# `== 'pull_request' && '' || secret`: an empty string is falsy in GitHub
# expressions, so the latter falls through and hands the secret to PR runs —
# the thing it looks like it prevents.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, not nightly. The timely signal is meant to come from the push side
    # (a spec change in getnoan/noan), not from polling here; this is the
    # backstop for drift that never touches the spec, such as a managed block
    # renamed in the product. 8-10 GETs, Mondays.
    #
    # GitHub disables scheduled workflows after 60 days without repository
    # activity, which on a quiet docs repo is a second way a backstop dies
    # quietly — re-enable it, or dispatch this manually, after a long lull.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    # The checks step's own outcome, so the report job below can tell "the skill and the
    # live API disagree" from "checkout or setup-node blipped".
    outputs:
      checks: ${{ steps.checks.outcome }}
      # pass | drift | config — the suite classifies its own failure, so a key
      # problem is never reported as the skill being wrong.
      result: ${{ steps.checks.outputs.outcome }}
      blocked: ${{ steps.checks.outputs.blocked }}
      failures: ${{ steps.checks.outputs.failures }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Before the suite, so it runs even when the checks step fails: the
      # reporter is the thing that would otherwise have no execution until the
      # first real failure needed it to work.
      - name: Exercise the drift reporter against a stub board
        run: node tests/report-drift.selftest.mjs

      - name: Check the skill against the spec and the live API
        id: checks
        env:
          NOAN_API_KEY: ${{ github.event_name != 'pull_request' && secrets.NOAN_API_KEY || '' }}
          REQUIRE_LIVE: ${{ github.event_name != 'pull_request' }}
        run: node tests/conformance.mjs

  # Separate job so `issues: write` is granted only where an issue can be filed.
  # Gated on what the suite says about itself (`result`), not on the job failing:
  # a checkout or setup-node blip must not file "the skill and the live API
  # disagree", and neither must a key problem, which exits 2 as `config` below.
  report:
    needs: conformance
    if: always() && github.event_name == 'schedule' && needs.conformance.outputs.result == 'drift'
    # The write key lives in this environment, which is restricted to main, so a
    # workflow edited on a branch cannot read it. The report jobs are the only
    # thing that needs it, and they only ever run on a schedule.
    environment: noan-write
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: File or update the drift issue
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Conformance: the skill and the live API disagree"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Still failing as of $(date -u +%Y-%m-%d). Run: $RUN_URL"
            url=$(gh issue view "$existing" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          else
            blocked_note=""
            if [ "${{ needs.conformance.outputs.blocked }}" != "0" ] && [ -n "${{ needs.conformance.outputs.blocked }}" ]; then
              blocked_note=" Note: ${{ needs.conformance.outputs.blocked }} check(s) in this run could not run at all (key, network or API), so it checked less than it looks."
            fi
            body=$(printf '%s\n\n%s\n\n%s' \
              "The weekly conformance run failed, which means the skill states something the API no longer does.$blocked_note" \
              "Run: $RUN_URL" \
              "Read the failing check name — each one names the claim and the file that makes it. Fix the documentation rather than the check, unless the claim was merely reworded, in which case update its anchor.")
            url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label documentation --body "$body")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # The issue is where the fix lands; the task is what makes a person look
      # at it. Separate write-scoped key: the suite's own key stays read-only
      # because that job runs code from pull requests, and this one never does.
      - name: File or update the NOAN task
        env:
          NOAN_TASK_API_KEY: ${{ secrets.NOAN_TASK_API_KEY }}
          KIND: drift
          FAILURES: ${{ needs.conformance.outputs.failures }}
          ISSUE_URL: ${{ steps.issue.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node tests/report-drift.mjs

  # A configuration fault is not drift and must not be filed as it: exit 2 means
  # the suite could not check, not that the skill is wrong. It still gets an
  # issue, because a red run nobody reads is the failure mode this whole
  # workflow exists to prevent.
  report-config:
    needs: conformance
    # `result == ''` is the suite dying before it could classify anything — a
    # crash, or the runner going away. That used to file nothing at all, which is
    # a red scheduled run telling nobody. `checks` exists for exactly this.
    if: >-
      always() && github.event_name == 'schedule' &&
      (needs.conformance.outputs.result == 'config' ||
       (needs.conformance.outputs.checks == 'failure' && needs.conformance.outputs.result == ''))
    # The write key lives in this environment, which is restricted to main, so a
    # workflow edited on a branch cannot read it. The report jobs are the only
    # thing that needs it, and they only ever run on a schedule.
    environment: noan-write
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: File or update the configuration issue
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Conformance: the suite cannot run its checks"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Still unable to run as of $(date -u +%Y-%m-%d). Run: $RUN_URL"
            url=$(gh issue view "$existing" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          else
            body=$(printf '%s\n\n%s\n\n%s' \
              "The weekly conformance run could not check the skill. Nothing here says the documentation is wrong." \
              "Run: $RUN_URL" \
              "Usual causes, in order: the NOAN_API_KEY secret (revoked, rotated, or scoped away — a 401, 403 or an empty workspace), the API being unreachable or rate limited, the published spec not fetching, or the run dying before it could classify itself. Fix the key or wait out the outage; do not edit the skill.")
            url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label configuration --body "$body")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: File or update the NOAN task
        env:
          NOAN_TASK_API_KEY: ${{ secrets.NOAN_TASK_API_KEY }}
          KIND: config
          FAILURES: ${{ needs.conformance.outputs.failures }}
          ISSUE_URL: ${{ steps.issue.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node tests/report-drift.mjs
