name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"

  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # No 401/403 allowance. It was here for api.getnoan.com, which answers 401
          # to every /v1 path without a key -- including ones that don't exist -- so
          # it proved only that the host was up, and it let ANY link answering 401 or
          # 403 pass. Every API URL in these docs is inside code, which lychee does not
          # check; whether the API itself is up is the conformance suite's job.
          #
          # The skill links its own reference files by their raw URL on main, so a
          # single-file install can fetch them. Checked as-is, a PR that ADDS a
          # reference file fails here until it merges (the file is not on main yet),
          # and a PR that DELETES one passes and breaks main. --remap checks those
          # links against this checkout instead, which gets both cases right.
          # Single quotes, not double: lychee-action runs these args through `eval`,
          # which would expand `$1` to nothing inside double quotes.
          args: >-
            --no-progress
            --remap '^https://raw\.githubusercontent\.com/getnoan/skills/main/(.*)$ file://${{ github.workspace }}/$1'
            "./**/*.md"
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL -o gitleaks.tar.gz "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" checksums.txt | sed 's#  .*#  gitleaks.tar.gz#' | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: Scan git history
        run: gitleaks git --redact --exit-code 1 --verbose .
